# Plugin dependencies for `hermes plugins install` / `hermes plugins validate --install-deps`.
# Hermes resolves these within its own version constraints. Not a package: Hermes loads the plugin from this folder.
[project]
name = "glasses-platform"
version = "0.6.2"
dependencies = ["aiohttp>=3.9,<4", "qrcode>=7.4,<9"]

[tool.uv]
package = false
