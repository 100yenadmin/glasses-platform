# Shared plugin bug form. Field ids and labels are FROZEN across our plugin repos: report-a-problem skills
# draft issues with these same headings, so do not rename them.
# Per repo: description, the security line, the diagnostics hint, and the surface options.
name: Bug report
description: Something in Hermes Glasses is broken or behaves unexpectedly.
labels: ["bug", "triage-pending"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.
        **Never paste a device token**: no connect URL, QR code, `.env` line or log line that contains one. Write `<token>` instead, and revoke and re-pair any device whose token was shared (`hermes glasses revoke <user> <device>`). Leave out photos from the glasses and private message text.
        **Security problems** (a request accepted without a valid token, one user reaching another user's session or devices, an approval answered by something other than that user's own device, a token or photo exposed) go to a [private advisory](https://github.com/100yenadmin/glasses-platform/security/advisories/new), not here.
        **Problems in Hermes itself** belong in [NousResearch/hermes-agent](https://github.com/NousResearch/hermes-agent/issues).
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: plugin_version
    attributes:
      label: Plugin version
      description: The glasses-platform entry from `hermes plugins list --json` (version and source).
    validations:
      required: true
  - type: input
    id: hermes_version
    attributes:
      label: Hermes version
      description: Output of `hermes --version`.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where it happened
      options:
        - hermes glasses try (terminal)
        - hermes-glasses iOS app (Meta Ray-Ban)
        - Even Realities G2 app
        - ESP32 voice box (xiaozhi)
        - Omi pendant
        - Pebble (Bobby)
        - Apple Watch or Siri Shortcut (HTTP route)
        - My own client (JavaScript, Python or other)
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26, Ubuntu 24.04, Windows 11 ...
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Output of `hermes glasses devices` (it never shows tokens), the device's protocol (v0 or v1) and the capabilities it declares, and whether the gateway was restarted after pairing.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Short excerpts only, for example from `hermes logs -n 300 | grep -i glasses`. Replace any token with `<token>`, and leave out keys and private message text.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report contains no device token, connect URL, QR code, photo, secret or private message.
          required: true
        - label: An AI agent helped draft this report, and I reviewed it.
